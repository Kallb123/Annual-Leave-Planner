<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Leave Planner" />
    <meta name="description" content="Plan your annual leave across the year and download it as an image." />
    <title>Annual Leave Planner</title>
    <link rel="canonical" href="https://annual-leave-planner.kallum.uk/" />
    <!-- Link previews (WhatsApp, Slack, Teams, iMessage...). Crawlers don't run JavaScript and need
         absolute URLs. Apps cache previews for a long time, so rename the image when it changes.
         The image is made by `npm run generate-og-image`. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Annual Leave Planner" />
    <meta property="og:title" content="Annual Leave Planner" />
    <meta property="og:description" content="Plan your annual leave across the year and download it as an image." />
    <meta property="og:url" content="https://annual-leave-planner.kallum.uk/" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:image" content="https://annual-leave-planner.kallum.uk/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Annual Leave Planner: four months of a calendar with leave booked around bank holidays" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
