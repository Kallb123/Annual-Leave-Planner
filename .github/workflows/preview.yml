# Deploys a Cloudflare Workers Preview for each pull request and comments the link on the PR.
# Workers Builds (Cloudflare's Git integration) can't post PR comments; only Pages can.
# See docs/deployment.md for the secrets this needs.
name: Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

# One run per PR at a time; a newer push supersedes an in-flight deploy.
concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  WRANGLER_VERSION: 4.165.0
  # Same name Workers Builds used, so existing previews keep their URLs.
  PREVIEW_NAME: ${{ github.head_ref }}
  COMMENT_MARKER: '<!-- cloudflare-preview -->'

jobs:
  deploy:
    # Fork PRs don't get repository secrets, so they can't deploy.
    if: github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Deploy preview
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_OUTPUT_FILE_PATH: ${{ runner.temp }}/wrangler-output.ndjson
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets are required. See docs/deployment.md."
            exit 1
          fi
          npx --yes "wrangler@$WRANGLER_VERSION" preview \
            --name "$PREVIEW_NAME" \
            --message "PR #$PR_NUMBER @ ${HEAD_SHA:0:7}"
          # Wrangler appends one JSON line per command to this file; take the preview entry.
          entry=$(jq -c 'select(.type == "preview")' "$WRANGLER_OUTPUT_FILE_PATH" | tail -n 1)
          preview_url=$(jq -r '.preview_urls[0] // empty' <<<"$entry")
          deployment_url=$(jq -r '.deployment_urls[0] // empty' <<<"$entry")
          if [ -z "$preview_url" ] && [ -z "$deployment_url" ]; then
            echo "::error::Wrangler returned no preview URL. Check that Preview URLs are enabled for the Worker."
            exit 1
          fi
          echo "preview_url=$preview_url" >> "$GITHUB_OUTPUT"
          echo "deployment_url=$deployment_url" >> "$GITHUB_OUTPUT"
          {
            echo "### Preview deployed"
            [ -n "$preview_url" ] && echo "- Branch: $preview_url"
            [ -n "$deployment_url" ] && echo "- This commit: $deployment_url"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.deploy.outputs.preview_url }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.deployment_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        with:
          script: |
            const { PREVIEW_URL, DEPLOYMENT_URL, HEAD_SHA, COMMENT_MARKER } = process.env;
            const rows = [];
            if (PREVIEW_URL) rows.push(`| Branch preview (always latest) | ${PREVIEW_URL} |`);
            if (DEPLOYMENT_URL) rows.push(`| This commit (\`${HEAD_SHA.slice(0, 7)}\`) | ${DEPLOYMENT_URL} |`);
            const body = [
              COMMENT_MARKER,
              '### Cloudflare preview',
              '',
              '| | URL |',
              '| --- | --- |',
              ...rows,
            ].join('\n');
            await upsertComment(github, context, COMMENT_MARKER, body);

            async function upsertComment(github, context, marker, body) {
              const { owner, repo } = context.repo;
              const issue_number = context.payload.pull_request.number;
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
              const existing = comments.find((c) => c.body?.startsWith(marker));
              if (existing) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }

  cleanup:
    if: github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Delete preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes "wrangler@$WRANGLER_VERSION" preview delete --name "$PREVIEW_NAME" --skip-confirmation

      - name: Update PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const marker = process.env.COMMENT_MARKER;
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const existing = comments.find((c) => c.body?.startsWith(marker));
            if (existing) {
              const body = `${marker}\n### Cloudflare preview\n\nPreview deleted because the pull request was closed.`;
              await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            }
